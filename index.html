<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>White Noise</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      padding: 0 0 5rem 0;
    }

    h1.title {
      font-family: Impact, 'Arial Narrow Bold', sans-serif;
      font-size: 6vw;
      letter-spacing: 4px;
      text-align: center;
      color: #fff;
      font-weight: normal;
      margin: 6vh 0 6vh 0;
    }

    /* Two-section layout: left 2/3, right 1/3 */
    .layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 4vw;
      padding: 0 4vw;
      align-items: start;
    }

    /* Album grid: always 2 columns, rows grow as albums are added */
    .albums {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2.5rem 2rem;
    }

    .album {
      display: block;
      color: #fff;
      text-decoration: none;
    }

    .album img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #1a1a1a;
      margin-bottom: 0.9rem;
      transition: opacity 0.2s ease;
    }

    .album:hover img {
      opacity: 0.8;
    }

    .album .artist {
      margin: 0 0 0.25rem 0;
      font-size: 1rem;
      opacity: 0.65;
    }

    .album .name {
      margin: 0;
      font-size: 1.3rem;
    }

    /* Right sidebar */
    .side {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      position: sticky;
      top: 2rem;
    }

    .btn {
      display: block;
      text-align: center;
      font-family: Impact, 'Arial Narrow Bold', sans-serif;
      letter-spacing: 3px;
      font-size: 1.5rem;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid #fff;
      padding: 1rem 1rem;
      text-decoration: none;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .btn:hover {
      background: #fff;
      color: #000;
    }

    .contact-box {
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 1.25rem 1.5rem;
      margin-top: 1rem;
    }

    .contact-box h2 {
      font-family: Impact, 'Arial Narrow Bold', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 2px;
      margin: 0 0 0.75rem 0;
    }

    .contact-box p {
      margin: 0.45rem 0;
      font-size: 1rem;
    }

    .contact-box a {
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* Stack sections on narrow screens (phones) */
    @media (max-width: 800px) {
      h1.title {
        font-size: 14vw;
      }

      .layout {
        grid-template-columns: 1fr;
        gap: 3rem;
      }

      .side {
        position: static;
      }
    }
  </style>
</head>

  <main class="layout">

    <section class="albums">

  </main>

</html>
