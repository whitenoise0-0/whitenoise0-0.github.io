<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Substrate - White Noise</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Georgia, 'Times New Roman', serif;
      padding: 0 1.5rem 6rem 1.5rem;
    }

    .back {
      display: inline-block;
      margin-top: 1.5rem;
      color: #fff;
      opacity: 0.6;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.95rem;
      text-decoration: none;
    }

    .back:hover { opacity: 1; }

    h1 {
      font-family: Impact, 'Arial Narrow Bold', sans-serif;
      font-weight: normal;
      font-size: 3rem;
      letter-spacing: 3px;
      text-align: center;
      margin: 4vh 0 5vh 0;
    }

    pre {
      max-width: 640px;
      margin: 0 auto;
      font-family: inherit;
      font-size: 1.2rem;
      line-height: 1.8;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
  </style>
</head>
<body>

  <a class="back" href="substrate.html">&larr; Back</a>

  <h1 id="title"></h1>
  <pre id="poem">Loading...</pre>

  <script>
    // id -> title shown on the page, and the text file inside the "poems" folder
    var poems = {
      "01": { title: "WALL OF NOISE",  file: "01 wall of noise.txt" },
      "02": { title: "ANOTHER LOVER", file: "02 another lover.txt" },
      "03": { title: "SCURVY",        file: "03 scurvy.txt" },
      "04": { title: "SAWDUST",       file: "04 sawdust.txt" },
      "05": { title: "SUPPORT",       file: "05 support.txt" },
      "06": { title: "THE PILGRIM",   file: "06 the pilgrim.txt" },
      "07": { title: "BLACK MOTH",    file: "07 black moth.txt" },
      "08": { title: "SUPER RAINBOW", file: "08 super rainbow.txt" },
      "09": { title: "THE DREAM",     file: "09 the dream.txt" }
    };

    var id = new URLSearchParams(window.location.search).get("p");
    var entry = poems[id];
    var titleEl = document.getElementById("title");
    var poemEl = document.getElementById("poem");

    if (!entry) {
      titleEl.textContent = "SUBSTRATE";
      poemEl.textContent = "Poem not found.";
    } else {
      titleEl.textContent = entry.title;
      document.title = entry.title + " - White Noise";
      fetch("poems/" + encodeURIComponent(entry.file))
        .then(function (r) {
          if (!r.ok) throw new Error("missing");
          return r.text();
        })
        .then(function (text) { poemEl.textContent = text; })
        .catch(function () { poemEl.textContent = "Poem coming soon."; });
    }
  </script>

</body>
</html>
